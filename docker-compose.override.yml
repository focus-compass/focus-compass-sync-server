# Self-host / direct-access override.
#
# Docker Compose auto-loads this file for a plain `docker compose up` (no -f),
# which is what the README Docker quick start runs. It publishes the server port
# on the host so http://<host>:<port> works without a reverse proxy. Set
# HOCUSPOCUS_PORT in .env when the default 8080 is unavailable.
#
# The public VPS installer does not use this repository or override file. It
# generates a separate pinned Compose project with a loopback-only publication.
#
# Reverse-proxy deploys (Dokploy/Traefik, etc.) invoke
# `docker compose -f docker-compose.yml ...` explicitly, which turns OFF
# override auto-loading — so they never bind the port on the host and keep
# routing over the compose network via the base file's `expose`. If you deploy
# behind your own proxy with a bare `docker compose up`, delete this file (or
# set HOCUSPOCUS_PORT to a free host port).
services:
  focus-compass:
    ports:
      - "${HOCUSPOCUS_PORT:-8080}:8080"
