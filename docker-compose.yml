version: '3.8'

services:
  hocuspocus-sync:
    # Build image from current directory using Dockerfile
    build: .
    
    # Container name for convenience
    container_name: hocuspocus_server
    
    # Always restart to ensure high uptime
    restart: unless-stopped
    
    # Port mapping:
    # 8080 (host) -> 8080 (container)
    # You can change 8080 on the host to e.g. 3000
    ports:
      - "${HOCUSPOCUS_PORT:-8080}:8080"
    
    # Environment variables
    environment:
      NODE_ENV: production
      PORT: 8080
      # Optional (see .env.example). If omitted, the server starts in setup mode.
      HOCUSPOCUS_TOKEN: ${HOCUSPOCUS_TOKEN}
      # Optional. If omitted, MCP is disabled until enabled from the admin UI.
      MCP_TOKEN: ${MCP_TOKEN}
      DB_PATH: ${DB_PATH:-./data/db.sqlite}
      IMAGES_DIR: ${IMAGES_DIR:-./data/images}
      BACKUP_DIR: ${BACKUP_DIR:-./data/backups}
      BACKUP_INTERVAL_MINUTES: ${BACKUP_INTERVAL_MINUTES:-60}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
      MAX_DOC_DECODE_BYTES: ${MAX_DOC_DECODE_BYTES:-8388608}
      CORS_ALLOW_ORIGINS: "${CORS_ALLOW_ORIGINS:-*}"
      YJS_GC: ${YJS_GC:-false}
    
    # Data Persistence:
    # Mount Docker Volume (or local folder) to store SQLite database.
    # This ensures data is preserved across container restarts or updates.
    # 'hocuspocus-data' is a named volume managed by Docker.
    volumes:
      - hocuspocus-data:/app/data
    
    # Healthcheck to monitor container status
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    # Resource limits to prevent excessive consumption
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
    # Network (optional but useful for isolation)
    networks:
      - hocuspocus-network

# Define named volume for persistent storage
volumes:
  hocuspocus-data:
    driver: local

# Define network for isolation
networks:
  hocuspocus-network:
    driver: bridge
