<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>Hocuspocus Demo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="dns-prefetch" href="https://esm.sh" />
    <link rel="preconnect" href="https://esm.sh" crossorigin />
    <link rel="preconnect" href="https://compass.sarfex.dev" crossorigin />
    <link rel="modulepreload" href="https://esm.sh/@hocuspocus/provider@3.4.0?bundle" />
    <link rel="modulepreload" href="https://esm.sh/yjs@13.6.27" />
    <style>
      :root {
        color-scheme: dark light;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --bg: #0f172a;
        --bg-muted: #1e293b;
        --border: #334155;
        --text: #e2e8f0;
        --text-muted: #94a3b8;
        --accent: #38bdf8;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at top, rgba(56, 189, 248, 0.22), transparent 55%), var(--bg);
        color: var(--text);
      }

      .shell {
        width: min(960px, 92vw);
        margin: 4vh auto;
        padding: 2.5rem;
        border-radius: 1.5rem;
        border: 1px solid var(--border);
        background: color-mix(in srgb, var(--bg-muted) 82%, rgba(15, 23, 42, 0.92));
        box-shadow: 0 20px 60px rgba(15, 23, 42, 0.55);
        display: flex;
        flex-direction: column;
        gap: 1.75rem;
      }

      header {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 3.5vw, 2.7rem);
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      .meta {
        display: grid;
        gap: 0.4rem;
        font-size: 0.95rem;
        color: var(--text-muted);
      }

      textarea#editor {
        min-height: clamp(320px, 45vh, 520px);
        padding: 1.2rem 1.4rem;
        font: inherit;
        border-radius: 1rem;
        border: 1px solid var(--border);
        background: color-mix(in srgb, var(--bg) 75%, rgba(15, 23, 42, 0.85));
        color: var(--text);
        resize: vertical;
        outline: none;
        white-space: pre-wrap;
        line-height: 1.55;
        box-shadow: inset 0 1px 0 rgba(148, 163, 184, 0.08);
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
      }

      textarea#editor:focus {
        border-color: rgba(56, 189, 248, 0.65);
        box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.18), inset 0 1px 0 rgba(148, 163, 184, 0.1);
      }

      @media (max-width: 640px) {
        .shell {
          padding: 1.75rem;
          gap: 1.5rem;
        }

        textarea#editor {
          min-height: 280px;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header>
        <h1>Hocuspocus</h1>
        <div class="meta">
          <div id="status">Статус: инициализация…</div>
        </div>
      </header>

      <textarea id="editor" placeholder="Начните вводить текст, чтобы поделиться им с другими клиентами…"></textarea>

    </div>

    <script type="module">
      import { HocuspocusProvider } from "https://esm.sh/@hocuspocus/provider@3.4.0?bundle";
      import { Doc } from "https://esm.sh/yjs@13.6.27";

      const statusElement = document.getElementById("status");
      const editor = document.getElementById("editor");

      const providerUrl = "wss://compass.sarfex.dev";
      const AUTH_TOKEN = "focus-compass-demo-token";
      const TEXT_CACHE_KEY = "hocuspocus-demo-text";

      const storage = (() => {
        try {
          return window.localStorage ?? null;
        } catch (error) {
          console.warn("Не удалось получить доступ к localStorage", error);
          return null;
        }
      })();

      const persistSnapshot = (text) => {
        if (!storage) return;

        try {
          storage.setItem(TEXT_CACHE_KEY, text);
        } catch (error) {
          console.warn("Не удалось сохранить локальную копию документа", error);
        }
      };

      const restoreCachedContent = () => {
        if (!storage) return false;

        try {
          const cached = storage.getItem(TEXT_CACHE_KEY);
          if (!cached) return false;

          editor.value = cached;
          return true;
        } catch (error) {
          console.warn("Не удалось восстановить локальную копию документа", error);
          return false;
        }
      };

      const ydoc = new Doc();
      const yText = ydoc.getText("demo");

      const hadCachedContent = restoreCachedContent();
      if (hadCachedContent) {
        statusElement.textContent = "Статус: загружены локальные данные, ожидание синхронизации…";
      }

      const applyRemoteContent = () => {
        const newText = yText.toString();
        if (editor.value === newText) return;

        if (document.activeElement === editor) {
          const { selectionStart, selectionEnd } = editor;
          editor.value = newText;
          editor.setSelectionRange(selectionStart, selectionEnd);
        } else {
          editor.value = newText;
        }

        persistSnapshot(newText);
      };

      let isLocalChange = false;

      const handleRemoteUpdate = () => {
        if (isLocalChange) return;
        applyRemoteContent();
      };

      const provider = new HocuspocusProvider({
        url: providerUrl,
        name: "demo-document",
        document: ydoc,
        token: AUTH_TOKEN,
      });

      provider.on("authenticationFailed", ({ reason }) => {
        const message = reason ? `Ошибка авторизации: ${reason}` : "Ошибка авторизации";
        statusElement.textContent = `Статус: ${message}`;
      });

      provider.on("authenticated", () => {
        statusElement.textContent = "Статус: успешно аутентифицирован";
      });

      provider.on("status", ({ status }) => {
        statusElement.textContent = `Статус: ${status}`;
      });

      provider.on("synced", (isSynced) => {
        statusElement.textContent = isSynced
          ? "Статус: синхронизация завершена"
          : "Статус: синхронизация прервана";

        if (isSynced) {
          handleRemoteUpdate();
        }
      });

      provider.on("disconnect", () => {
        statusElement.textContent = "Статус: соединение разорвано";
      });

      provider.on("close", () => {
        statusElement.textContent = "Статус: соединение закрыто";
      });

      provider.on("error", (event) => {
        statusElement.textContent = `Статус: ошибка — ${event.message ?? event}`;
      });

      yText.observe(handleRemoteUpdate);

      editor.addEventListener("input", () => {
        isLocalChange = true;
        ydoc.transact(() => {
          yText.delete(0, yText.length);
          yText.insert(0, editor.value);
        });
        isLocalChange = false;

        persistSnapshot(editor.value);
      });

      if (!hadCachedContent) {
        handleRemoteUpdate();
      }
    </script>
  </body>
</html>
