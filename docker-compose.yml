version: '3.8'

services:
  hocuspocus-sync:
    # Build image from current directory using Dockerfile
    build: .
    
    # Container name for convenience
    container_name: hocuspocus_server
    
    # Always restart to ensure high uptime
    restart: unless-stopped
    
    # Port mapping:
    # 8080 (host) -> 8080 (container)
    # You can change 8080 on the host to e.g. 3000
    ports:
      - "${HOCUSPOCUS_PORT:-8080}:8080"
    
    # Environment variables
    environment:
      - NODE_ENV=production
      - PORT=8080
    
    # Data Persistence:
    # Mount Docker Volume (or local folder) to store SQLite database.
    # This ensures data is preserved across container restarts or updates.
    # 'hocuspocus-data' is a named volume managed by Docker.
    volumes:
      - hocuspocus-data:/app/data
    
    # Healthcheck to monitor container status
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect({port:8080,host:'localhost'}).on('error',()=>process.exit(1)).on('connect',()=>process.exit(0))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    # Resource limits to prevent excessive consumption
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
    # Network (optional but useful for isolation)
    networks:
      - hocuspocus-network

# Define named volume for persistent storage
volumes:
  hocuspocus-data:
    driver: local

# Define network for isolation
networks:
  hocuspocus-network:
    driver: bridge