services:
  focus-compass:
    image: ${FOCUS_COMPASS_IMAGE:-ghcr.io/focus-compass/focus-compass-sync-server:v0.0.5}
    pull_policy: always
    restart: unless-stopped
    # Base file is reverse-proxy friendly (Dokploy/Traefik, Caddy, nginx):
    # the proxy reaches the container over the compose network, so the port is
    # only exposed internally and NOT bound on the host (host 8080 is usually
    # taken by the proxy — binding it fails with "port is already allocated").
    # Direct host access for the self-host installer / README quick start is
    # added by docker-compose.override.yml, which a plain `docker compose up`
    # auto-loads but an explicit `docker compose -f docker-compose.yml` (what
    # reverse-proxy platforms run) deliberately ignores.
    expose:
      - "8080"
    environment:
      NODE_ENV: production
      NODE_OPTIONS: "--max-old-space-size=768"
      PORT: 8080
      ACCESS_TOKEN: ${ACCESS_TOKEN:-}
      MCP_TOKEN: ${MCP_TOKEN:-}
      DB_PATH: ${DB_PATH:-./data/db.sqlite}
      IMAGES_DIR: ${IMAGES_DIR:-./data/images}
      BACKUP_DIR: ${BACKUP_DIR:-./data/backups}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
      MAX_DOC_DECODE_BYTES: ${MAX_DOC_DECODE_BYTES:-134217728}
      CORS_ALLOW_ORIGINS: "${CORS_ALLOW_ORIGINS:-*}"
      YJS_GC: ${YJS_GC:-true}
    volumes:
      - hocuspocus-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  hocuspocus-data:
    driver: local
