services:
  focus-compass:
    image: ${FOCUS_COMPASS_IMAGE:-ghcr.io/focus-compass/focus-compass-sync-server:latest}
    pull_policy: always
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      NODE_ENV: production
      NODE_OPTIONS: "--max-old-space-size=768"
      PORT: 8080
      HOCUSPOCUS_TOKEN: ${HOCUSPOCUS_TOKEN:-}
      MCP_TOKEN: ${MCP_TOKEN:-}
      DB_PATH: ${DB_PATH:-./data/db.sqlite}
      IMAGES_DIR: ${IMAGES_DIR:-./data/images}
      BACKUP_DIR: ${BACKUP_DIR:-./data/backups}
      BACKUP_INTERVAL_MINUTES: ${BACKUP_INTERVAL_MINUTES:-60}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
      MAX_DOC_DECODE_BYTES: ${MAX_DOC_DECODE_BYTES:-134217728}
      CORS_ALLOW_ORIGINS: "${CORS_ALLOW_ORIGINS:-*}"
      YJS_GC: ${YJS_GC:-true}
    volumes:
      - hocuspocus-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  hocuspocus-data:
    driver: local
