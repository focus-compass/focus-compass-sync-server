# E2E tests for the public setup guides (focus-compass.com/sync-server).
#
# Triggers:
#   - workflow_run: right AFTER "Publish Docker Image" finishes on main, so we
#     test the exact image that just shipped. Running here (not on `push`)
#     avoids the race where the test pulls an earlier image while the new one
#     is still building. The completed workflow's immutable `sha-*` tag is used.
#   - workflow_dispatch: on demand from the Actions tab.
#   - schedule: weekly safety net for silent rot of the published image or the
#     external production installer, even when we changed nothing.
name: guides-e2e

on:
  workflow_dispatch:
    inputs:
      installer_url:
        description: Installer URL to test
        required: false
        default: https://focus-compass.com/install-sync-server.sh
      image:
        description: Versioned image reference to test
        required: false
        default: ghcr.io/focus-compass/focus-compass-sync-server:v0.0.7
  workflow_run:
    workflows: ["Publish Docker Image"]
    types: [completed]
    branches: [main]
  schedule:
    # Weekly: Monday 06:20 UTC
    - cron: "20 6 * * 1"

jobs:
  docker-guide:
    name: docker run guide (published image)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # On a workflow_run trigger, only proceed if the image build succeeded; a
    # failed build has nothing new to test. Manual/scheduled runs always go.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Run the Docker guide test
        shell: bash
        env:
          MANUAL_IMAGE: ${{ github.event.inputs.image }}
          PUBLISHED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ -n "${PUBLISHED_SHA}" ]; then
            export IMAGE="ghcr.io/focus-compass/focus-compass-sync-server:sha-${PUBLISHED_SHA:0:7}"
            export REQUIRE_MULTIARCH=1
          elif [ -n "${MANUAL_IMAGE}" ]; then
            export IMAGE="${MANUAL_IMAGE}"
            export REQUIRE_MULTIARCH=1
          fi
          bash tests/test-docker-guide.sh

  install-script:
    name: curl | bash guide (production script)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The installer is deployed by the app repository after this image has a
    # stable digest. Testing production during the server-image workflow races
    # that deployment and exercises the previous installer. Manual and weekly
    # runs validate the actual public URL after the two-stage release completes.
    if: github.event_name != 'workflow_run'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Run the installer guide test
        env:
          INSTALLER_URL: ${{ github.event.inputs.installer_url || 'https://focus-compass.com/install-sync-server.sh' }}
        run: bash tests/test-install-script.sh
