<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Focus Compass Admin</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f2ea;
      --panel: rgba(255, 255, 255, 0.72);
      --panel-solid: #ffffff;
      --ink: #0f172a;
      --muted: rgba(15, 23, 42, 0.65);
      --border: rgba(15, 23, 42, 0.12);
      --shadow: 0 18px 50px rgba(15, 23, 42, 0.12);
      --accent: #0f766e;
      --accent-2: #b45309;
      --danger: #b91c1c;
      --ok: #166534;
      --code: "Consolas", "JetBrains Mono", "Fira Code", monospace;
      --ui: "Candara", "Trebuchet MS", "Segoe UI", sans-serif;
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      font-family: var(--ui);
      color: var(--ink);
      background:
        radial-gradient(900px 500px at 20% 10%, rgba(15, 118, 110, 0.12), transparent 60%),
        radial-gradient(700px 420px at 80% 0%, rgba(180, 83, 9, 0.10), transparent 60%),
        repeating-linear-gradient(135deg, rgba(15, 23, 42, 0.02) 0 2px, transparent 2px 10px),
        var(--bg);
      overflow-x: hidden;
    }

    .app {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      animation: app-in 240ms ease-out;
    }

    @keyframes app-in {
      from {
        opacity: 0;
        transform: translateY(6px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 50;
      border-bottom: 1px solid var(--border);
      background: rgba(246, 242, 234, 0.72);
      backdrop-filter: blur(10px);
    }

    .topbar-inner {
      max-width: 1320px;
      margin: 0 auto;
      padding: 1rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .brand {
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
    }

    .brand-title {
      font-weight: 800;
      letter-spacing: -0.02em;
      font-size: 1.1rem;
      line-height: 1.1;
    }

    .brand-sub {
      font-size: 0.82rem;
      color: var(--muted);
      font-family: var(--code);
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .field {
      display: grid;
      gap: 0.25rem;
    }

    .field label {
      font-size: 0.72rem;
      color: var(--muted);
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    input[type="password"],
    input[type="text"] {
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.9);
      border-radius: 12px;
      padding: 0.55rem 0.7rem;
      font: inherit;
      outline: none;
      min-width: 240px;
    }

    input:focus {
      border-color: rgba(15, 118, 110, 0.45);
      box-shadow: 0 0 0 4px rgba(15, 118, 110, 0.10);
    }

    button {
      border: 1px solid transparent;
      border-radius: 12px;
      padding: 0.55rem 0.8rem;
      font: inherit;
      font-weight: 650;
      cursor: pointer;
      background: var(--accent);
      color: white;
      transition: transform 120ms ease, opacity 120ms ease, background 120ms ease;
      user-select: none;
    }

    button:hover {
      opacity: 0.92;
      transform: translateY(-1px);
    }

    button:active {
      transform: translateY(0);
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      transform: none;
    }

    button.ghost {
      background: rgba(255, 255, 255, 0.65);
      border-color: var(--border);
      color: var(--ink);
    }

    button.danger {
      background: var(--danger);
      color: white;
    }

    button.tiny {
      padding: 0.4rem 0.55rem;
      border-radius: 10px;
      font-size: 0.85rem;
    }

    .layout {
      width: 100%;
      max-width: 1320px;
      margin: 0 auto;
      padding: 1rem;
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 1rem;
      align-items: start;
      flex: 1;
    }

    @media (max-width: 980px) {
      .layout {
        grid-template-columns: 1fr;
      }
    }

    .nav {
      position: sticky;
      top: 88px;
      align-self: start;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    @media (max-width: 980px) {
      .nav {
        position: static;
        flex-direction: row;
        flex-wrap: wrap;
      }
    }

    .nav button {
      width: 100%;
      justify-content: flex-start;
      text-align: left;
    }

    @media (max-width: 980px) {
      .nav button {
        width: auto;
      }
    }

    .nav button.ghost.active {
      border-color: rgba(15, 118, 110, 0.35);
      box-shadow: 0 0 0 4px rgba(15, 118, 110, 0.10);
    }

    .nav-meta {
      margin-top: 0.5rem;
      padding: 0.8rem 0.9rem;
      border: 1px dashed rgba(15, 23, 42, 0.18);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.5);
      color: var(--muted);
      font-size: 0.85rem;
      line-height: 1.35;
      white-space: pre-line;
    }

    .main {
      display: grid;
      gap: 1rem;
    }

    .view {
      display: none;
    }

    .view.active {
      display: grid;
      gap: 1rem;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .panel-header {
      padding: 0.95rem 1rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 0.75rem;
    }

    .panel-title {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: -0.01em;
    }

    .panel-sub {
      color: var(--muted);
      font-size: 0.85rem;
      font-family: var(--code);
    }

    .panel-body {
      padding: 1rem;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 0.75rem;
    }

    @media (max-width: 980px) {
      .cards {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 520px) {
      .cards {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: rgba(255, 255, 255, 0.75);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 0.9rem;
      display: grid;
      gap: 0.35rem;
      min-height: 96px;
    }

    .card-kicker {
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .card-value {
      font-size: 1.35rem;
      font-weight: 900;
      letter-spacing: -0.02em;
    }

    .card-sub {
      font-family: var(--code);
      font-size: 0.82rem;
      color: var(--muted);
      line-height: 1.3;
    }

    .split {
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 1rem;
      align-items: start;
    }

    @media (max-width: 980px) {
      .split {
        grid-template-columns: 1fr;
      }
    }

    .list {
      display: grid;
      gap: 0.35rem;
      max-height: 560px;
      overflow: auto;
      padding-right: 0.25rem;
    }

    .list-item {
      border: 1px solid var(--border);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.7);
      padding: 0.65rem 0.75rem;
      cursor: pointer;
      transition: background 120ms ease, transform 120ms ease;
    }

    .list-item:hover {
      background: rgba(15, 118, 110, 0.08);
      transform: translateY(-1px);
    }

    .list-item.active {
      background: rgba(15, 118, 110, 0.12);
      border-color: rgba(15, 118, 110, 0.28);
    }

    .list-top {
      display: flex;
      gap: 0.6rem;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.75rem;
    }

    .mini {
      font-size: 0.82rem;
      color: var(--muted);
      font-family: var(--code);
    }

    .doc-name {
      font-weight: 800;
      line-height: 1.2;
      word-break: break-word;
    }

    .doc-meta {
      margin-top: 0.25rem;
      font-size: 0.82rem;
      color: var(--muted);
      font-family: var(--code);
      display: flex;
      gap: 0.6rem;
      flex-wrap: wrap;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.22rem 0.55rem;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.7);
      font-family: var(--code);
      font-size: 0.78rem;
      font-weight: 800;
      color: var(--ink);
      white-space: nowrap;
    }

    .pill.ok {
      border-color: rgba(22, 101, 52, 0.25);
      background: rgba(22, 101, 52, 0.10);
    }

    .pill.warn {
      border-color: rgba(180, 83, 9, 0.25);
      background: rgba(180, 83, 9, 0.10);
    }

    .detail {
      display: grid;
      gap: 0.75rem;
    }

    .detail-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .detail-title {
      display: grid;
      gap: 0.25rem;
      min-width: 0;
    }

    .detail-title h2 {
      margin: 0;
      font-size: 1.2rem;
      font-weight: 900;
      letter-spacing: -0.02em;
      word-break: break-word;
    }

    .detail-actions {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      align-items: center;
    }

    .doc-grid {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 0.75rem;
      align-items: start;
    }

    @media (max-width: 980px) {
      .doc-grid {
        grid-template-columns: 1fr;
      }
    }

    .history {
      border: 1px solid var(--border);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.65);
      overflow: hidden;
    }

    .history-head {
      padding: 0.75rem 0.85rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 0.6rem;
    }

    .history-head strong {
      font-weight: 900;
    }

    .history-list {
      max-height: 420px;
      overflow: auto;
      padding: 0.4rem;
      display: grid;
      gap: 0.35rem;
    }

    .history-item {
      border: 1px solid var(--border);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.75);
      padding: 0.55rem 0.65rem;
      cursor: pointer;
      transition: background 120ms ease, transform 120ms ease;
      display: grid;
      gap: 0.2rem;
    }

    .history-item:hover {
      background: rgba(180, 83, 9, 0.08);
      transform: translateY(-1px);
    }

    .history-item.active {
      background: rgba(180, 83, 9, 0.12);
      border-color: rgba(180, 83, 9, 0.28);
    }

    .history-line {
      font-weight: 850;
      font-size: 0.9rem;
      line-height: 1.2;
    }

    .history-sub {
      color: var(--muted);
      font-size: 0.76rem;
      font-family: var(--code);
      word-break: break-word;
    }

    .viewer {
      border: 1px solid var(--border);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.65);
      overflow: hidden;
    }

    .tabs {
      display: flex;
      gap: 0.35rem;
      padding: 0.45rem;
      border-bottom: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.9);
    }

    .tab {
      padding: 0.45rem 0.65rem;
      border-radius: 12px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--ink);
      font-weight: 800;
      cursor: pointer;
    }

    .tab.active {
      background: rgba(15, 118, 110, 0.10);
      border-color: rgba(15, 118, 110, 0.24);
    }

    .viewer-meta {
      padding: 0.6rem 0.85rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      color: var(--muted);
      font-family: var(--code);
      font-size: 0.8rem;
    }

    .viewer-body {
      padding: 0.85rem;
      max-height: 520px;
      overflow: auto;
    }

    .empty {
      padding: 2.2rem 1rem;
      text-align: center;
      color: var(--muted);
      font-family: var(--code);
    }

    .json-tree {
      font-family: var(--code);
      font-size: 0.85rem;
      line-height: 1.5;
    }

    .json-key {
      color: #0369a1;
      font-weight: 700;
    }

    .json-string {
      color: #0f766e;
    }

    .json-number {
      color: #b45309;
    }

    .json-boolean {
      color: #2563eb;
    }

    .json-null {
      color: var(--muted);
    }

    .json-bracket {
      color: var(--muted);
    }

    .collapsible {
      cursor: pointer;
      user-select: none;
    }

    .collapsible::before {
      content: "\25BC ";
      font-size: 0.75em;
      color: var(--muted);
    }

    .collapsible.collapsed::before {
      content: "\25B6 ";
    }

    .collapsed + .json-content {
      display: none;
    }

    .indent {
      margin-left: 1.25rem;
    }

    .images-toolbar {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.75rem;
    }

    .images-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.75rem;
    }

    @media (max-width: 1100px) {
      .images-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 620px) {
      .images-grid {
        grid-template-columns: 1fr;
      }
    }

    .img-card {
      border: 1px solid var(--border);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.75);
      overflow: hidden;
      display: grid;
      grid-template-rows: 150px auto;
    }

    .img-thumb {
      background:
        radial-gradient(300px 140px at 30% 20%, rgba(15, 118, 110, 0.16), transparent 60%),
        radial-gradient(260px 160px at 80% 0%, rgba(180, 83, 9, 0.12), transparent 60%),
        #f8fafc;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .img-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .img-thumb.ready img {
      display: block;
    }

    .img-thumb .img-fallback {
      font-family: var(--code);
      font-weight: 900;
      color: rgba(15, 23, 42, 0.55);
      background: rgba(255, 255, 255, 0.75);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 0.25rem 0.6rem;
      position: absolute;
      bottom: 0.65rem;
      left: 0.65rem;
      max-width: calc(100% - 1.3rem);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .img-body {
      padding: 0.75rem 0.85rem;
      display: grid;
      gap: 0.45rem;
    }

    .img-id {
      font-weight: 900;
      font-family: var(--code);
      font-size: 0.9rem;
      word-break: break-word;
    }

    .img-meta {
      color: var(--muted);
      font-size: 0.78rem;
      font-family: var(--code);
      display: flex;
      gap: 0.6rem;
      flex-wrap: wrap;
    }

    .img-actions {
      display: flex;
      gap: 0.45rem;
      flex-wrap: wrap;
    }

    .toast {
      position: fixed;
      right: 1rem;
      bottom: 1rem;
      z-index: 999;
      padding: 0.85rem 1rem;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow);
      transform: translateY(16px);
      opacity: 0;
      transition: transform 160ms ease, opacity 160ms ease;
      max-width: min(520px, calc(100vw - 2rem));
      pointer-events: none;
    }

    .toast.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .toast.error {
      border-color: rgba(185, 28, 28, 0.25);
      background: rgba(254, 242, 242, 0.96);
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.55);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .modal.visible {
      display: flex;
    }

    .modal-card {
      width: 100%;
      max-width: 720px;
      background: var(--panel-solid);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: var(--shadow);
      overflow: hidden;
      transform: translateY(8px);
      animation: modal-in 160ms ease-out;
    }

    @keyframes modal-in {
      from {
        opacity: 0;
        transform: translateY(12px);
      }

      to {
        opacity: 1;
        transform: translateY(8px);
      }
    }

    .modal-head {
      padding: 0.95rem 1rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 0.75rem;
    }

    .modal-head h3 {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 900;
      letter-spacing: -0.01em;
    }

    .modal-body {
      padding: 1rem;
    }

    .modal-actions {
      padding: 0.85rem 1rem;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: flex-end;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .preview {
      display: grid;
      gap: 0.75rem;
    }

    .preview img {
      width: 100%;
      max-height: 64vh;
      object-fit: contain;
      border-radius: 16px;
      border: 1px solid var(--border);
      background: #f8fafc;
    }

    .preview-meta {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      font-family: var(--code);
      color: var(--muted);
      font-size: 0.85rem;
    }

    .hint {
      font-family: var(--code);
      color: var(--muted);
      font-size: 0.85rem;
    }
  </style>
</head>

<body>
  <div class="app">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand">
          <div class="brand-title">Focus Compass Admin</div>
          <div class="brand-sub">SQLite + Yjs snapshots</div>
        </div>
        <div class="top-actions">
          <div class="field">
            <label for="token">Token</label>
            <input type="password" id="token" placeholder="Bearer token" autocomplete="current-password" />
          </div>
          <button id="connectBtn">Connect</button>
          <button id="refreshAllBtn" class="ghost" disabled>Refresh</button>
        </div>
      </div>
    </header>

    <div class="layout">
      <div class="nav">
        <button class="ghost" data-view="overview">Overview</button>
        <button class="ghost" data-view="documents">Documents</button>
        <button class="ghost" data-view="images">Images</button>
        <div class="nav-meta" id="navMeta">Disconnected</div>
      </div>

      <main class="main">
        <section class="view" id="view-overview">
          <div class="panel">
            <div class="panel-header">
              <h2 class="panel-title">Storage</h2>
              <div class="panel-sub" id="overviewSub">-</div>
            </div>
            <div class="panel-body">
              <div class="cards">
                <div class="card">
                  <div class="card-kicker">Database</div>
                  <div class="card-value" id="statDb">-</div>
                  <div class="card-sub" id="statDbSub">-</div>
                </div>
                <div class="card">
                  <div class="card-kicker">Backups</div>
                  <div class="card-value" id="statBackups">-</div>
                  <div class="card-sub" id="statBackupsSub">-</div>
                </div>
                <div class="card">
                  <div class="card-kicker">Images</div>
                  <div class="card-value" id="statImages">-</div>
                  <div class="card-sub" id="statImagesSub">-</div>
                </div>
                <div class="card">
                  <div class="card-kicker">Total</div>
                  <div class="card-value" id="statTotal">-</div>
                  <div class="card-sub" id="statTotalSub">-</div>
                </div>
              </div>
              <div style="margin-top: 0.9rem" class="hint" id="overviewHint">Use Refresh to see new backups after edits.</div>
            </div>
          </div>
        </section>

        <section class="view" id="view-documents">
          <div class="split">
            <div class="panel">
              <div class="panel-header">
                <h2 class="panel-title">Documents</h2>
                <div class="panel-sub" id="docsSub">-</div>
              </div>
              <div class="panel-body">
                <div class="list-top">
                  <input type="text" id="docSearch" placeholder="Search documents" autocomplete="off" />
                  <button class="ghost tiny" id="docsRefreshBtn">Refresh</button>
                </div>
                <div class="list" id="docList"></div>
              </div>
            </div>

            <div class="panel">
              <div class="panel-header">
                <h2 class="panel-title">Viewer</h2>
                <div class="panel-sub" id="viewerSub">-</div>
              </div>
              <div class="panel-body">
                <div id="docEmpty" class="empty">Select a document</div>

                <div id="docDetail" class="detail" style="display: none;">
                  <div class="detail-header">
                    <div class="detail-title">
                      <h2 id="docTitle">-</h2>
                      <div style="display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center;">
                        <span class="pill ok" id="docVersion">Current</span>
                        <span class="pill" id="docMetaPill">-</span>
                      </div>
                    </div>
                    <div class="detail-actions">
                      <button class="ghost tiny" id="docRefreshBtn">Refresh</button>
                      <button class="ghost tiny" id="docCopyBtn">Copy JSON</button>
                      <button class="danger tiny" id="docDeleteBtn">Delete</button>
                    </div>
                  </div>

                  <div class="doc-grid">
                    <div class="history">
                      <div class="history-head">
                        <strong>History</strong>
                        <span class="panel-sub" id="docHistorySub">-</span>
                      </div>
                      <div class="history-list" id="docHistory"></div>
                    </div>

                    <div class="viewer">
                      <div class="tabs">
                        <button class="tab active" data-tab="tree">Tree</button>
                        <button class="tab" data-tab="raw">Raw</button>
                      </div>
                      <div class="viewer-meta" id="docViewerMeta">-</div>
                      <div class="viewer-body" id="docViewer"></div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </section>

        <section class="view" id="view-images">
          <div class="panel">
            <div class="panel-header">
              <h2 class="panel-title">Images</h2>
              <div class="panel-sub" id="imagesSub">-</div>
            </div>
            <div class="panel-body">
              <div class="images-toolbar">
                <input type="text" id="imageSearch" placeholder="Search image IDs" autocomplete="off" />
                <div style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
                  <button class="ghost" id="imagesRefreshBtn">Refresh</button>
                </div>
              </div>
              <div class="images-grid" id="imagesGrid"></div>
            </div>
          </div>
        </section>
      </main>
    </div>
  </div>

  <div class="modal" id="confirmModal" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
    <div class="modal-card">
      <div class="modal-head">
        <h3 id="confirmTitle">Confirm</h3>
        <button class="ghost tiny" id="confirmCloseBtn">Close</button>
      </div>
      <div class="modal-body">
        <div id="confirmBody" class="hint">-</div>
      </div>
      <div class="modal-actions">
        <button class="ghost" id="confirmCancelBtn">Cancel</button>
        <button class="danger" id="confirmOkBtn">Delete</button>
      </div>
    </div>
  </div>

  <div class="modal" id="imageModal" role="dialog" aria-modal="true" aria-labelledby="imageTitle">
    <div class="modal-card">
      <div class="modal-head">
        <h3 id="imageTitle">Image</h3>
        <button class="ghost tiny" id="imageCloseBtn">Close</button>
      </div>
      <div class="modal-body">
        <div class="preview">
          <img id="imagePreview" alt="" />
          <div class="preview-meta" id="imageMeta">-</div>
        </div>
      </div>
      <div class="modal-actions">
        <button class="ghost" id="imageCopyBtn">Copy ID</button>
        <button class="danger" id="imageDeleteBtn">Delete</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const state = {
      token: localStorage.getItem("admin-token") || "",
      connected: false,
      activeView: "overview",
      lastRefreshIso: null,

      dbInfo: null,
      backups: [],
      backupsTotalBytes: null,
      docs: [],

      images: [],

      selectedDoc: null,
      selectedDocVersion: { kind: "current", backup: null },
      selectedDocData: null,
      selectedTab: "tree",

      docSearch: "",
      imageSearch: "",

      confirm: { open: false, title: "", body: "", onConfirm: null },
      imageModal: { open: false, id: null, blobUrl: null },

      thumbUrls: new Map(),
      thumbQueue: [],
      thumbInFlight: 0,
      thumbWanted: new Set(),
    };

    const $ = (id) => document.getElementById(id);

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, (c) => {
        switch (c) {
          case "&":
            return "&amp;";
          case "<":
            return "&lt;";
          case ">":
            return "&gt;";
          case "\"":
            return "&quot;";
          case "'":
            return "&#39;";
          default:
            return c;
        }
      });
    }

    function formatBytes(bytes) {
      const n = Number(bytes) || 0;
      if (!n) return "0 B";
      const k = 1024;
      const sizes = ["B", "KB", "MB", "GB", "TB"];
      const i = Math.floor(Math.log(n) / Math.log(k));
      return `${parseFloat((n / Math.pow(k, i)).toFixed(2))} ${sizes[i]}`;
    }

    function formatLocalDateTime(isoString) {
      if (!isoString) return "";
      try {
        return new Date(isoString).toLocaleString();
      } catch {
        return String(isoString);
      }
    }

    function toast(msg, type = "") {
      const el = $("toast");
      el.className = `toast ${type}`.trim();
      el.textContent = msg;
      el.classList.add("visible");
      clearTimeout(toast._t);
      toast._t = setTimeout(() => el.classList.remove("visible"), 2600);
    }

    async function apiCall(endpoint, options = {}) {
      const res = await fetch(`${location.origin}${endpoint}`, {
        ...options,
        headers: {
          Authorization: `Bearer ${state.token}`,
          ...options.headers,
        },
      });

      if (!res.ok) {
        const data = await res.json().catch(() => ({}));
        throw new Error(data.error || `${res.status} ${res.statusText}`);
      }

      return res.json();
    }

    async function apiBlob(endpoint) {
      const res = await fetch(`${location.origin}${endpoint}`, {
        headers: {
          Authorization: `Bearer ${state.token}`,
        },
      });

      if (!res.ok) {
        const data = await res.json().catch(() => ({}));
        throw new Error(data.error || `${res.status} ${res.statusText}`);
      }

      return res.blob();
    }

    function setConnected(connected) {
      state.connected = connected;
      $("refreshAllBtn").disabled = !connected;

      $("navMeta").textContent = connected
        ? `Connected\nLast refresh: ${state.lastRefreshIso ? formatLocalDateTime(state.lastRefreshIso) : "-"}`
        : "Disconnected";
    }

    function setView(view) {
      state.activeView = view;
      document.querySelectorAll(".view").forEach((el) => {
        el.classList.toggle("active", el.id === `view-${view}`);
      });
      document.querySelectorAll(".nav button[data-view]").forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.view === view);
      });
    }

    function calcImagesBytes(images) {
      if (!Array.isArray(images)) return 0;
      return images.reduce((sum, img) => sum + (Number(img?.size) || 0), 0);
    }

    function calcBackupsBytes(backups, fallbackTotal) {
      const fallback = Number(fallbackTotal);
      if (Number.isFinite(fallback) && fallback > 0) return fallback;
      if (!Array.isArray(backups)) return 0;
      return backups.reduce(
        (sum, b) => sum + (Number(b?.totalSizeBytes) || Number(b?.sizeBytes) || 0),
        0
      );
    }

    function renderOverview() {
      const db = state.dbInfo;
      const dbBytes = db ? Number(db.dbTotalSize ?? db.dbSize) || 0 : 0;
      const backupsBytes = calcBackupsBytes(state.backups, state.backupsTotalBytes);
      const imagesBytes = calcImagesBytes(state.images);
      const totalBytes = dbBytes + backupsBytes + imagesBytes;

      $("overviewSub").textContent = state.lastRefreshIso
        ? `Last refresh ${formatLocalDateTime(state.lastRefreshIso)}`
        : "-";

      $("statDb").textContent = formatBytes(dbBytes);
      $("statDbSub").textContent = db
        ? `${db.documentCount} docs | sidecars ${formatBytes(Number(db.dbSidecarsSize) || 0)}`
        : "-";

      $("statBackups").textContent = formatBytes(backupsBytes);
      $("statBackupsSub").textContent = `${state.backups.length} snapshots`;

      $("statImages").textContent = formatBytes(imagesBytes);
      $("statImagesSub").textContent = `${state.images.length} files`;

      $("statTotal").textContent = formatBytes(totalBytes);
      $("statTotalSub").textContent = `DB + backups + images`;
    }

    function renderDocList() {
      const list = $("docList");
      list.innerHTML = "";

      const q = state.docSearch.trim().toLowerCase();
      const docs = Array.isArray(state.docs) ? state.docs : [];
      const filtered = q ? docs.filter((d) => String(d.name).toLowerCase().includes(q)) : docs;

      $("docsSub").textContent = `${filtered.length} / ${docs.length}`;

      if (!filtered.length) {
        list.innerHTML = '<div class="empty">No documents</div>';
        return;
      }

      for (const doc of filtered) {
        const item = document.createElement("div");
        item.className = "list-item";
        item.dataset.name = doc.name;
        if (state.selectedDoc === doc.name) item.classList.add("active");

        const name = document.createElement("div");
        name.className = "doc-name";
        name.textContent = doc.name;

        const meta = document.createElement("div");
        meta.className = "doc-meta";
        meta.textContent = `${formatBytes(doc.dataSize)} | ${doc.sharedTypes} types`;

        item.appendChild(name);
        item.appendChild(meta);
        list.appendChild(item);
      }
    }

    function renderDocHistory() {
      const el = $("docHistory");
      el.innerHTML = "";

      const backups = Array.isArray(state.backups) ? state.backups : [];
      $("docHistorySub").textContent = backups.length ? `${backups.length} backups` : "No backups";

      const mkItem = (label, sub, isActive, kind, backupFile) => {
        const item = document.createElement("div");
        item.className = "history-item";
        if (isActive) item.classList.add("active");
        item.dataset.kind = kind;
        item.dataset.backup = backupFile || "";

        const line = document.createElement("div");
        line.className = "history-line";
        line.textContent = label;

        const s = document.createElement("div");
        s.className = "history-sub";
        s.textContent = sub;

        item.appendChild(line);
        item.appendChild(s);
        return item;
      };

      const currentActive = state.selectedDocVersion.kind === "current";
      el.appendChild(mkItem("Current", "Live database", currentActive, "current", null));

      for (const b of backups) {
        const file = String(b.file || "");
        const label = b.createdAt ? formatLocalDateTime(b.createdAt) : file;
        const size = Number(b.totalSizeBytes ?? b.sizeBytes) || 0;
        const sub = `${formatBytes(size)} | ${file}`;
        const active = state.selectedDocVersion.kind === "backup" && state.selectedDocVersion.backup === file;
        el.appendChild(mkItem(label, sub, active, "backup", file));
      }
    }

    function renderJsonTree(obj, depth = 0) {
      if (obj === null) return '<span class="json-null">null</span>';
      if (obj === undefined) return '<span class="json-null">undefined</span>';

      const type = typeof obj;
      if (type === "string") {
        const escaped = escapeHtml(obj);
        const display = escaped.length > 240 ? `${escaped.slice(0, 240)}...` : escaped;
        return `<span class="json-string">"${display}"</span>`;
      }
      if (type === "number") return `<span class="json-number">${obj}</span>`;
      if (type === "boolean") return `<span class="json-boolean">${obj}</span>`;

      if (Array.isArray(obj)) {
        if (!obj.length) return '<span class="json-bracket">[]</span>';
        const items = obj
          .map(
            (item, i) =>
              `<div class="indent">${renderJsonTree(item, depth + 1)}${i < obj.length - 1 ? "," : ""}</div>`
          )
          .join("");
        const collapsed = depth > 2 ? " collapsed" : "";
        return (
          `<span class="collapsible${collapsed}" onclick="this.classList.toggle('collapsed')">Array(${obj.length})</span>` +
          `<div class="json-content"><span class="json-bracket">[</span>${items}<span class="json-bracket">]</span></div>`
        );
      }

      if (type === "object") {
        const keys = Object.keys(obj);
        if (!keys.length) return '<span class="json-bracket">{}</span>';
        const items = keys
          .map(
            (key, i) =>
              `<div class="indent"><span class="json-key">"${escapeHtml(key)}"</span>: ${renderJsonTree(obj[key], depth + 1)}${i < keys.length - 1 ? "," : ""}</div>`
          )
          .join("");
        const collapsed = depth > 2 ? " collapsed" : "";
        return (
          `<span class="collapsible${collapsed}" onclick="this.classList.toggle('collapsed')">Object(${keys.length})</span>` +
          `<div class="json-content"><span class="json-bracket">{</span>${items}<span class="json-bracket">}</span></div>`
        );
      }

      return escapeHtml(String(obj));
    }

    function renderDocViewer() {
      if (!state.selectedDoc) {
        $("docEmpty").style.display = "block";
        $("docDetail").style.display = "none";
        $("viewerSub").textContent = "-";
        return;
      }

      $("docEmpty").style.display = "none";
      $("docDetail").style.display = "grid";
      $("docTitle").textContent = state.selectedDoc;

      const v = state.selectedDocVersion;
      if (v.kind === "backup" && v.backup) {
        $("docVersion").textContent = "Backup";
        $("docVersion").className = "pill warn";
      } else {
        $("docVersion").textContent = "Current";
        $("docVersion").className = "pill ok";
      }

      const data = state.selectedDocData;
      const exists = data && data.exists !== false;
      const binarySize = data ? Number(data.binarySize) || 0 : 0;
      const sharedCount = data && Array.isArray(data.sharedTypeNames) ? data.sharedTypeNames.length : 0;

      $("docMetaPill").textContent = exists ? `${formatBytes(binarySize)} | ${sharedCount} types` : "Not present";
      $("docViewerMeta").textContent = exists
        ? `binary ${formatBytes(binarySize)} | shared ${sharedCount}`
        : "Document not present in this snapshot";

      renderDocHistory();

      const viewer = $("docViewer");
      if (!exists) {
        viewer.innerHTML = '<div class="empty">Document not present in this backup</div>';
        $("viewerSub").textContent = v.kind === "backup" ? "Backup" : "Current";
        return;
      }

      const content = data && data.content ? data.content : {};
      if (state.selectedTab === "raw") {
        viewer.innerHTML = `<pre class="json-tree">${escapeHtml(JSON.stringify(content, null, 2))}</pre>`;
      } else {
        if (content && typeof content === "object" && Object.keys(content).length === 0) {
          viewer.innerHTML = '<div class="empty">No data</div>';
        } else {
          viewer.innerHTML = `<div class="json-tree">${renderJsonTree(content)}</div>`;
        }
      }

      $("viewerSub").textContent = v.kind === "backup" ? "Backup" : "Current";
    }

    function revokeThumbs() {
      for (const url of state.thumbUrls.values()) {
        try {
          URL.revokeObjectURL(url);
        } catch {
          // ignore
        }
      }
      state.thumbUrls.clear();
      state.thumbQueue = [];
      state.thumbWanted.clear();
      state.thumbInFlight = 0;
    }

    function rememberThumb(id, url) {
      state.thumbUrls.set(id, url);
      state.thumbQueue.push(id);
      const limit = 48;
      while (state.thumbQueue.length > limit) {
        const oldId = state.thumbQueue.shift();
        if (!oldId) break;
        const oldUrl = state.thumbUrls.get(oldId);
        state.thumbUrls.delete(oldId);
        if (oldUrl) {
          try {
            URL.revokeObjectURL(oldUrl);
          } catch {
            // ignore
          }
        }
      }
    }

    async function loadThumb(id, imgEl, hostEl) {
      if (!state.connected) return;
      if (!state.thumbWanted.has(id)) return;
      if (state.thumbInFlight >= 4) return;
      if (!imgEl || !hostEl) return;

      const cached = state.thumbUrls.get(id);
      if (cached) {
        imgEl.src = cached;
        hostEl.classList.add("ready");
        return;
      }

      state.thumbInFlight++;
      try {
        const blob = await apiBlob(`/api/images/${encodeURIComponent(id)}`);
        if (!state.thumbWanted.has(id)) return;
        const url = URL.createObjectURL(blob);
        rememberThumb(id, url);
        imgEl.src = url;
        hostEl.classList.add("ready");
      } catch {
        // ignore thumbnail failures
      } finally {
        state.thumbInFlight--;
      }
    }

    function renderImages() {
      const grid = $("imagesGrid");
      grid.innerHTML = "";

      revokeThumbs();

      const q = state.imageSearch.trim().toLowerCase();
      const images = Array.isArray(state.images) ? state.images : [];
      const filtered = q ? images.filter((img) => String(img.id).toLowerCase().includes(q)) : images;

      const totalBytes = calcImagesBytes(filtered);
      $("imagesSub").textContent = `${filtered.length} files | ${formatBytes(totalBytes)}`;

      if (!filtered.length) {
        grid.innerHTML = '<div class="empty">No images</div>';
        return;
      }

      for (const img of filtered) {
        const id = String(img.id);
        const size = Number(img.size) || 0;
        const modified = img.modified ? formatLocalDateTime(img.modified) : "-";

        const card = document.createElement("div");
        card.className = "img-card";
        card.dataset.id = id;

        const thumb = document.createElement("div");
        thumb.className = "img-thumb";
        const imageEl = document.createElement("img");
        imageEl.alt = id;
        thumb.appendChild(imageEl);

        const fallback = document.createElement("div");
        fallback.className = "img-fallback";
        fallback.textContent = id;
        thumb.appendChild(fallback);

        const body = document.createElement("div");
        body.className = "img-body";

        const title = document.createElement("div");
        title.className = "img-id";
        title.textContent = id;

        const meta = document.createElement("div");
        meta.className = "img-meta";
        meta.textContent = `${formatBytes(size)} | ${modified}`;

        const actions = document.createElement("div");
        actions.className = "img-actions";

        const viewBtn = document.createElement("button");
        viewBtn.className = "ghost tiny";
        viewBtn.textContent = "View";
        viewBtn.dataset.action = "view";

        const delBtn = document.createElement("button");
        delBtn.className = "danger tiny";
        delBtn.textContent = "Delete";
        delBtn.dataset.action = "delete";

        actions.appendChild(viewBtn);
        actions.appendChild(delBtn);

        body.appendChild(title);
        body.appendChild(meta);
        body.appendChild(actions);

        card.appendChild(thumb);
        card.appendChild(body);
        grid.appendChild(card);

        state.thumbWanted.add(id);

        // Lazy thumb: only load if card is on screen.
        observeThumb(card, id, imageEl, thumb);
      }
    }

    let thumbObserver = null;
    function observeThumb(cardEl, id, imgEl, hostEl) {
      if (!thumbObserver) {
        thumbObserver = new IntersectionObserver(
          (entries) => {
            for (const entry of entries) {
              if (!entry.isIntersecting) continue;
              const el = entry.target;
              thumbObserver.unobserve(el);
              const imageId = el.dataset.id;
              const imgNode = el.querySelector("img");
              const host = el.querySelector(".img-thumb");
              if (!imageId || !imgNode || !host) continue;
              loadThumb(imageId, imgNode, host);
            }
          },
          { root: null, rootMargin: "160px", threshold: 0.01 }
        );
      }
      thumbObserver.observe(cardEl);
    }

    function openConfirm({ title, body, onConfirm }) {
      state.confirm = { open: true, title, body, onConfirm };
      $("confirmTitle").textContent = title;
      $("confirmBody").textContent = body;
      $("confirmModal").classList.add("visible");
    }

    function closeConfirm() {
      state.confirm = { open: false, title: "", body: "", onConfirm: null };
      $("confirmModal").classList.remove("visible");
    }

    async function refreshAll() {
      if (!state.token) return;
      $("refreshAllBtn").disabled = true;
      try {
        const [dbInfo, backupsData, imagesData] = await Promise.all([
          apiCall("/api/admin/db-info"),
          apiCall("/api/admin/backups"),
          apiCall("/api/images"),
        ]);

        state.dbInfo = dbInfo;
        state.docs = Array.isArray(dbInfo.documents) ? dbInfo.documents : [];

        state.backups = Array.isArray(backupsData.backups) ? backupsData.backups : [];
        const backupsTotal = Number(backupsData.totalSizeBytes);
        state.backupsTotalBytes = Number.isFinite(backupsTotal) ? backupsTotal : null;

        state.images = Array.isArray(imagesData.images) ? imagesData.images : [];

        state.lastRefreshIso = new Date().toISOString();
        setConnected(true);

        renderOverview();
        renderDocList();
        renderImages();

        if (state.selectedDoc) {
          await reloadSelectedDoc();
        } else {
          renderDocViewer();
        }
      } catch (err) {
        setConnected(false);
        toast(`Refresh failed: ${err.message}`, "error");
      } finally {
        $("refreshAllBtn").disabled = !state.connected;
      }
    }

    async function loadDoc(name, version = { kind: "current", backup: null }) {
      const endpoint =
        version.kind === "backup" && version.backup
          ? `/api/admin/documents/${encodeURIComponent(name)}?backup=${encodeURIComponent(version.backup)}`
          : `/api/admin/documents/${encodeURIComponent(name)}`;

      return apiCall(endpoint);
    }

    async function reloadSelectedDoc() {
      if (!state.selectedDoc) return;
      try {
        state.selectedDocData = await loadDoc(state.selectedDoc, state.selectedDocVersion);
      } catch (err) {
        toast(`Failed to load document: ${err.message}`, "error");
        state.selectedDocData = null;
      }
      renderDocViewer();
    }

    async function selectDoc(name) {
      state.selectedDoc = name;
      state.selectedDocVersion = { kind: "current", backup: null };
      state.selectedTab = "tree";
      document.querySelectorAll(".tab").forEach((t) => t.classList.toggle("active", t.dataset.tab === "tree"));
      renderDocList();
      await reloadSelectedDoc();
    }

    async function selectDocVersion(kind, backupFile) {
      if (!state.selectedDoc) return;
      state.selectedDocVersion =
        kind === "backup" && backupFile ? { kind: "backup", backup: backupFile } : { kind: "current", backup: null };
      await reloadSelectedDoc();
    }

    async function deleteSelectedDoc() {
      if (!state.selectedDoc) return;
      const name = state.selectedDoc;
      await apiCall(`/api/admin/documents/${encodeURIComponent(name)}`, { method: "DELETE" });
      toast(`Deleted document: ${name}`);
      state.selectedDoc = null;
      state.selectedDocData = null;
      await refreshAll();
      renderDocViewer();
    }

    function copySelectedDocJson() {
      if (!state.selectedDocData || state.selectedDocData.exists === false) return;
      const txt = JSON.stringify(state.selectedDocData.content || {}, null, 2);
      navigator.clipboard
        .writeText(txt)
        .then(() => toast("Copied JSON"))
        .catch((err) => toast(`Copy failed: ${err.message}`, "error"));
    }

    async function openImageModal(id) {
      $("imageTitle").textContent = id;
      $("imageMeta").textContent = "Loading";
      $("imagePreview").src = "";
      $("imagePreview").alt = id;

      state.imageModal = { open: true, id, blobUrl: null };
      $("imageModal").classList.add("visible");

      try {
        const blob = await apiBlob(`/api/images/${encodeURIComponent(id)}`);
        const url = URL.createObjectURL(blob);
        state.imageModal.blobUrl = url;
        $("imagePreview").src = url;

        const img = state.images.find((x) => String(x.id) === id);
        const size = img ? Number(img.size) || 0 : blob.size;
        const modified = img && img.modified ? formatLocalDateTime(img.modified) : "-";
        $("imageMeta").textContent = `Size ${formatBytes(size)} | Modified ${modified}`;
      } catch (err) {
        $("imageMeta").textContent = `Failed to load: ${err.message}`;
      }
    }

    function closeImageModal() {
      $("imageModal").classList.remove("visible");
      if (state.imageModal.blobUrl) {
        try {
          URL.revokeObjectURL(state.imageModal.blobUrl);
        } catch {
          // ignore
        }
      }
      state.imageModal = { open: false, id: null, blobUrl: null };
    }

    function copyImageId() {
      const id = state.imageModal.id;
      if (!id) return;
      navigator.clipboard
        .writeText(id)
        .then(() => toast("Copied image ID"))
        .catch((err) => toast(`Copy failed: ${err.message}`, "error"));
    }

    async function deleteImage(id) {
      await apiCall(`/api/images/${encodeURIComponent(id)}`, { method: "DELETE" });
      toast(`Deleted image: ${id}`);
    }

    function wireEvents() {
      $("token").value = state.token;

      $("connectBtn").addEventListener("click", async () => {
        state.token = $("token").value.trim();
        if (!state.token) {
          toast("Token required", "error");
          return;
        }
        localStorage.setItem("admin-token", state.token);
        await refreshAll();
      });

      $("token").addEventListener("keydown", (e) => {
        if (e.key === "Enter") $("connectBtn").click();
      });

      $("refreshAllBtn").addEventListener("click", refreshAll);

      document.querySelectorAll(".nav button[data-view]").forEach((btn) => {
        btn.addEventListener("click", () => setView(btn.dataset.view));
      });

      $("docsRefreshBtn").addEventListener("click", refreshAll);
      $("imagesRefreshBtn").addEventListener("click", refreshAll);

      $("docSearch").addEventListener("input", (e) => {
        state.docSearch = e.target.value;
        renderDocList();
      });

      $("imageSearch").addEventListener("input", (e) => {
        state.imageSearch = e.target.value;
        renderImages();
      });

      $("docList").addEventListener("click", (e) => {
        const item = e.target.closest(".list-item");
        if (!item) return;
        selectDoc(item.dataset.name);
      });

      $("docHistory").addEventListener("click", (e) => {
        const item = e.target.closest(".history-item");
        if (!item) return;
        const kind = item.dataset.kind;
        const backup = item.dataset.backup || null;
        selectDocVersion(kind, backup);
      });

      document.querySelectorAll(".tabs").forEach((tabs) => {
        tabs.addEventListener("click", (e) => {
          const tab = e.target.closest(".tab");
          if (!tab) return;
          state.selectedTab = tab.dataset.tab;
          tabs.querySelectorAll(".tab").forEach((t) => t.classList.toggle("active", t === tab));
          renderDocViewer();
        });
      });

      $("docRefreshBtn").addEventListener("click", async () => {
        await refreshAll();
      });

      $("docCopyBtn").addEventListener("click", copySelectedDocJson);

      $("docDeleteBtn").addEventListener("click", () => {
        if (!state.selectedDoc) return;
        openConfirm({
          title: "Delete document",
          body: `This will delete "${state.selectedDoc}" from the current database. Backups are not changed.`,
          onConfirm: async () => {
            closeConfirm();
            try {
              await deleteSelectedDoc();
            } catch (err) {
              toast(`Delete failed: ${err.message}`, "error");
            }
          },
        });
      });

      $("confirmCloseBtn").addEventListener("click", closeConfirm);
      $("confirmCancelBtn").addEventListener("click", closeConfirm);
      $("confirmModal").addEventListener("click", (e) => {
        if (e.target === $("confirmModal")) closeConfirm();
      });
      $("confirmOkBtn").addEventListener("click", async () => {
        if (typeof state.confirm.onConfirm === "function") {
          await state.confirm.onConfirm();
        }
      });

      $("imagesGrid").addEventListener("click", async (e) => {
        const btn = e.target.closest("button[data-action]");
        const card = e.target.closest(".img-card");
        if (!card) return;
        const id = card.dataset.id;
        if (!id) return;

        const action = btn ? btn.dataset.action : "view";

        if (action === "view") {
          await openImageModal(id);
          return;
        }

        if (action === "delete") {
          openConfirm({
            title: "Delete image",
            body: `Delete image "${id}"?`,
            onConfirm: async () => {
              closeConfirm();
              try {
                await deleteImage(id);
                await refreshAll();
              } catch (err) {
                toast(`Delete failed: ${err.message}`, "error");
              }
            },
          });
        }
      });

      $("imageCloseBtn").addEventListener("click", closeImageModal);
      $("imageModal").addEventListener("click", (e) => {
        if (e.target === $("imageModal")) closeImageModal();
      });
      $("imageCopyBtn").addEventListener("click", copyImageId);
      $("imageDeleteBtn").addEventListener("click", () => {
        const id = state.imageModal.id;
        if (!id) return;
        openConfirm({
          title: "Delete image",
          body: `Delete image "${id}"?`,
          onConfirm: async () => {
            closeConfirm();
            closeImageModal();
            try {
              await deleteImage(id);
              await refreshAll();
            } catch (err) {
              toast(`Delete failed: ${err.message}`, "error");
            }
          },
        });
      });

      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          closeConfirm();
          closeImageModal();
        }
      });
    }

    function boot() {
      wireEvents();
      setView("overview");

      if (state.token) {
        setConnected(true);
        $("refreshAllBtn").disabled = false;
        refreshAll();
      }
    }

    boot();
  </script>
</body>

</html>
