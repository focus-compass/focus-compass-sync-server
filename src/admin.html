<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Yjs Database Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      color-scheme: dark light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --bg: #0f172a;
      --bg-muted: #1e293b;
      --border: #334155;
      --text: #e2e8f0;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --success: #22c55e;
      --warning: #f59e0b;
      --error: #ef4444;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, rgba(56, 189, 248, 0.15), transparent 55%), var(--bg);
      color: var(--text);
      padding: 1rem;
    }

    .shell {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    h1 {
      margin: 0;
      font-size: 1.75rem;
      font-weight: 700;
    }

    .auth-form {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    input[type="text"],
    input[type="password"] {
      padding: 0.5rem 0.75rem;
      border-radius: 0.5rem;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font: inherit;
      outline: none;
      min-width: 200px;
    }

    input:focus {
      border-color: var(--accent);
    }

    button {
      padding: 0.5rem 1rem;
      border-radius: 0.5rem;
      border: none;
      background: var(--accent);
      color: var(--bg);
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    button:hover {
      opacity: 0.85;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    button.secondary {
      background: var(--bg-muted);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
    }

    .stat-card {
      background: var(--bg-muted);
      border: 1px solid var(--border);
      border-radius: 1rem;
      padding: 1.25rem;
    }

    .stat-label {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 0.25rem;
    }

    .stat-value {
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--accent);
    }

    .stat-value.success {
      color: var(--success);
    }

    .stat-value.warning {
      color: var(--warning);
    }

    .section {
      background: var(--bg-muted);
      border: 1px solid var(--border);
      border-radius: 1rem;
      overflow: hidden;
    }

    .section-header {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .section-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin: 0;
    }

    .doc-list {
      max-height: 400px;
      overflow-y: auto;
    }

    .doc-item {
      padding: 0.85rem 1.25rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      transition: background 0.15s;
    }

    .doc-item:last-child {
      border-bottom: none;
    }

    .doc-item:hover {
      background: rgba(56, 189, 248, 0.1);
    }

    .doc-item.selected {
      background: rgba(56, 189, 248, 0.2);
    }

    .doc-name {
      font-weight: 500;
      word-break: break-all;
    }

    .doc-meta {
      display: flex;
      gap: 1rem;
      font-size: 0.85rem;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .viewer {
      padding: 1.25rem;
      max-height: 500px;
      overflow: auto;
    }

    .viewer-placeholder {
      color: var(--text-muted);
      text-align: center;
      padding: 2rem;
    }

    .json-tree {
      font-family: "JetBrains Mono", "Fira Code", monospace;
      font-size: 0.85rem;
      line-height: 1.5;
    }

    .json-key {
      color: #7dd3fc;
    }

    .json-string {
      color: #86efac;
    }

    .json-number {
      color: #fcd34d;
    }

    .json-boolean {
      color: #f472b6;
    }

    .json-null {
      color: var(--text-muted);
    }

    .json-bracket {
      color: var(--text-muted);
    }

    .collapsible {
      cursor: pointer;
      user-select: none;
    }

    .collapsible::before {
      content: "▼ ";
      font-size: 0.7em;
      color: var(--text-muted);
    }

    .collapsible.collapsed::before {
      content: "▶ ";
    }

    .collapsed+.json-content {
      display: none;
    }

    .indent {
      margin-left: 1.5rem;
    }

    .error-msg {
      color: var(--error);
      padding: 1rem;
      text-align: center;
    }

    .loading {
      text-align: center;
      padding: 2rem;
      color: var(--text-muted);
    }

    .loading::after {
      content: "";
      animation: dots 1.5s infinite;
    }

    @keyframes dots {
      0%,
      20% {
        content: ".";
      }

      40% {
        content: "..";
      }

      60%,
      100% {
        content: "...";
      }
    }

    .tabs {
      display: flex;
      gap: 0.5rem;
      padding: 0 1.25rem;
      border-bottom: 1px solid var(--border);
    }

    .tab {
      padding: 0.75rem 1rem;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      color: var(--text-muted);
      transition: all 0.2s;
    }

    .tab:hover {
      color: var(--text);
    }

    .tab.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    .raw-view {
      background: var(--bg);
      padding: 1rem;
      border-radius: 0.5rem;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-all;
      font-family: "JetBrains Mono", "Fira Code", monospace;
      font-size: 0.8rem;
    }

    .copy-btn {
      font-size: 0.8rem;
      padding: 0.35rem 0.75rem;
    }
  </style>
</head>

<body>
  <div class="shell">
    <header>
      <h1>Yjs Database Admin</h1>
      <div class="auth-form">
        <input type="password" id="token" placeholder="Bearer Token" />
        <button onclick="connect()">Connect</button>
      </div>
    </header>

    <div id="content" style="display: none;">
      <div class="stats-grid" id="stats">
        <div class="stat-card">
          <div class="stat-label">Database Size</div>
          <div class="stat-value" id="db-size">-</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Documents</div>
          <div class="stat-value" id="doc-count">-</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Total Data Size</div>
          <div class="stat-value" id="total-data">-</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Images</div>
          <div class="stat-value" id="image-count">-</div>
        </div>
      </div>

      <div class="section">
        <div class="section-header">
          <h2 class="section-title">Documents</h2>
          <button class="secondary" onclick="refreshData()">Refresh</button>
        </div>
        <div class="doc-list" id="doc-list">
          <div class="loading">Loading documents</div>
        </div>
      </div>

      <div class="section" id="viewer-section" style="display: none;">
        <div class="section-header">
          <h2 class="section-title">Document: <span id="viewer-doc-name">-</span></h2>
          <button class="copy-btn secondary" onclick="copyJson()">Copy JSON</button>
        </div>
        <div class="tabs">
          <div class="tab active" data-tab="tree" onclick="switchTab('tree')">Tree View</div>
          <div class="tab" data-tab="raw" onclick="switchTab('raw')">Raw JSON</div>
          <div class="tab" data-tab="structure" onclick="switchTab('structure')">CRDT Structure</div>
        </div>
        <div class="viewer" id="viewer">
          <div class="viewer-placeholder">Select a document to view its contents</div>
        </div>
      </div>
    </div>

    <div id="error" class="error-msg" style="display: none;"></div>
  </div>

  <script>
    let authToken = "";
    let currentDoc = null;
    let currentData = null;
    let currentTab = "tree";

    function getApiBase() {
      return window.location.origin;
    }

    async function apiCall(endpoint) {
      const res = await fetch(`${getApiBase()}${endpoint}`, {
        headers: { Authorization: `Bearer ${authToken}` }
      });
      if (!res.ok) {
        throw new Error(`API error: ${res.status} ${res.statusText}`);
      }
      return res.json();
    }

    async function connect() {
      authToken = document.getElementById("token").value;
      if (!authToken) {
        showError("Please enter a token");
        return;
      }

      try {
        await refreshData();
        document.getElementById("content").style.display = "block";
        document.getElementById("error").style.display = "none";
      } catch (err) {
        showError(`Connection failed: ${err.message}`);
      }
    }

    async function refreshData() {
      try {
        const [dbInfo, images] = await Promise.all([
          apiCall("/api/admin/db-info"),
          apiCall("/api/images").catch(() => ({ count: 0, images: [] }))
        ]);

        document.getElementById("db-size").textContent = formatBytes(dbInfo.dbSize);
        document.getElementById("doc-count").textContent = dbInfo.documentCount;
        document.getElementById("total-data").textContent = formatBytes(dbInfo.totalDataSize);
        document.getElementById("image-count").textContent = images.count;

        renderDocList(dbInfo.documents);
      } catch (err) {
        showError(`Failed to load data: ${err.message}`);
      }
    }

    function renderDocList(docs) {
      const list = document.getElementById("doc-list");
      if (!docs || docs.length === 0) {
        list.innerHTML = '<div class="viewer-placeholder">No documents found</div>';
        return;
      }

      list.innerHTML = docs.map(doc => `
        <div class="doc-item ${currentDoc === doc.name ? 'selected' : ''}"
             onclick="selectDoc('${escapeHtml(doc.name)}')">
          <span class="doc-name">${escapeHtml(doc.name)}</span>
          <span class="doc-meta">
            <span>${formatBytes(doc.dataSize)}</span>
            <span>${doc.sharedTypes} types</span>
          </span>
        </div>
      `).join("");
    }

    async function selectDoc(name) {
      currentDoc = name;
      document.getElementById("viewer-section").style.display = "block";
      document.getElementById("viewer-doc-name").textContent = name;
      document.getElementById("viewer").innerHTML = '<div class="loading">Loading document</div>';

      // Update selection in list
      document.querySelectorAll(".doc-item").forEach(el => {
        el.classList.toggle("selected", el.querySelector(".doc-name").textContent === name);
      });

      try {
        currentData = await apiCall(`/api/admin/documents/${encodeURIComponent(name)}`);
        renderCurrentTab();
      } catch (err) {
        document.getElementById("viewer").innerHTML = `<div class="error-msg">Failed to load: ${err.message}</div>`;
      }
    }

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll(".tab").forEach(el => {
        el.classList.toggle("active", el.dataset.tab === tab);
      });
      renderCurrentTab();
    }

    function renderCurrentTab() {
      if (!currentData) return;

      const viewer = document.getElementById("viewer");

      switch (currentTab) {
        case "tree":
          viewer.innerHTML = `<div class="json-tree">${renderJsonTree(currentData.content)}</div>`;
          break;
        case "raw":
          viewer.innerHTML = `<div class="raw-view">${escapeHtml(JSON.stringify(currentData.content, null, 2))}</div>`;
          break;
        case "structure":
          viewer.innerHTML = `<div class="json-tree">${renderStructureInfo(currentData)}</div>`;
          break;
      }
    }

    function renderJsonTree(obj, depth = 0) {
      if (obj === null) return '<span class="json-null">null</span>';
      if (obj === undefined) return '<span class="json-null">undefined</span>';

      const type = typeof obj;

      if (type === "string") {
        const escaped = escapeHtml(obj);
        if (escaped.length > 200) {
          return `<span class="json-string">"${escaped.substring(0, 200)}..."</span>`;
        }
        return `<span class="json-string">"${escaped}"</span>`;
      }
      if (type === "number") return `<span class="json-number">${obj}</span>`;
      if (type === "boolean") return `<span class="json-boolean">${obj}</span>`;

      if (Array.isArray(obj)) {
        if (obj.length === 0) return '<span class="json-bracket">[]</span>';

        const items = obj.map((item, i) =>
          `<div class="indent">${renderJsonTree(item, depth + 1)}${i < obj.length - 1 ? ',' : ''}</div>`
        ).join("");

        return `<span class="collapsible" onclick="this.classList.toggle('collapsed')">Array(${obj.length})</span>` +
          `<div class="json-content"><span class="json-bracket">[</span>${items}<span class="json-bracket">]</span></div>`;
      }

      if (type === "object") {
        const keys = Object.keys(obj);
        if (keys.length === 0) return '<span class="json-bracket">{}</span>';

        const items = keys.map((key, i) =>
          `<div class="indent"><span class="json-key">"${escapeHtml(key)}"</span>: ${renderJsonTree(obj[key], depth + 1)}${i < keys.length - 1 ? ',' : ''}</div>`
        ).join("");

        return `<span class="collapsible" onclick="this.classList.toggle('collapsed')">Object(${keys.length})</span>` +
          `<div class="json-content"><span class="json-bracket">{</span>${items}<span class="json-bracket">}</span></div>`;
      }

      return String(obj);
    }

    function renderStructureInfo(data) {
      const info = {
        documentName: data.name,
        binarySize: formatBytes(data.binarySize),
        sharedTypes: data.sharedTypeNames,
        typeDetails: {}
      };

      // Analyze each shared type
      for (const [key, value] of Object.entries(data.content)) {
        info.typeDetails[key] = analyzeType(value);
      }

      return renderJsonTree(info);
    }

    function analyzeType(value) {
      if (value === null || value === undefined) {
        return { type: "null" };
      }

      if (Array.isArray(value)) {
        return {
          type: "Y.Array",
          length: value.length,
          itemTypes: [...new Set(value.map(v => typeof v))]
        };
      }

      if (typeof value === "object") {
        const keys = Object.keys(value);
        return {
          type: "Y.Map",
          keyCount: keys.length,
          keys: keys.slice(0, 20),
          hasMore: keys.length > 20
        };
      }

      if (typeof value === "string") {
        return {
          type: "Y.Text",
          length: value.length
        };
      }

      return { type: typeof value };
    }

    function copyJson() {
      if (!currentData) return;
      navigator.clipboard.writeText(JSON.stringify(currentData.content, null, 2))
        .then(() => alert("Copied to clipboard!"))
        .catch(err => alert("Failed to copy: " + err.message));
    }

    function formatBytes(bytes) {
      if (bytes === 0) return "0 B";
      const k = 1024;
      const sizes = ["B", "KB", "MB", "GB"];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + " " + sizes[i];
    }

    function escapeHtml(str) {
      if (typeof str !== "string") return str;
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function showError(msg) {
      document.getElementById("error").textContent = msg;
      document.getElementById("error").style.display = "block";
    }

    // Check for saved token
    const savedToken = localStorage.getItem("admin-token");
    if (savedToken) {
      document.getElementById("token").value = savedToken;
    }

    // Save token on connect
    const origConnect = connect;
    connect = async function () {
      await origConnect();
      localStorage.setItem("admin-token", authToken);
    };
  </script>
</body>

</html>
