services:
  focus-compass:
    image: ${FOCUS_COMPASS_IMAGE:-ghcr.io/focus-compass/focus-compass-sync-server:latest}
    pull_policy: always
    restart: unless-stopped
    # The install script writes HOCUSPOCUS_PORT into .env and the setup guide
    # promises http://<host>:<port> right after install — the port must be
    # published on the host, not just exposed to the compose network.
    ports:
      - "${HOCUSPOCUS_PORT:-8080}:8080"
    environment:
      NODE_ENV: production
      NODE_OPTIONS: "--max-old-space-size=768"
      PORT: 8080
      ACCESS_TOKEN: ${ACCESS_TOKEN:-}
      MCP_TOKEN: ${MCP_TOKEN:-}
      DB_PATH: ${DB_PATH:-./data/db.sqlite}
      IMAGES_DIR: ${IMAGES_DIR:-./data/images}
      BACKUP_DIR: ${BACKUP_DIR:-./data/backups}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
      MAX_DOC_DECODE_BYTES: ${MAX_DOC_DECODE_BYTES:-134217728}
      CORS_ALLOW_ORIGINS: "${CORS_ALLOW_ORIGINS:-*}"
      YJS_GC: ${YJS_GC:-true}
    volumes:
      - hocuspocus-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  hocuspocus-data:
    driver: local
